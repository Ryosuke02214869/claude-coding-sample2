<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストップウォッチ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ストップウォッチ</h1>
        <div class="stopwatch">
            <div class="display" id="display">00:00:00.00</div>
            <div class="buttons">
                <button id="startBtn" class="btn btn-start">スタート</button>
                <button id="stopBtn" class="btn btn-stop" disabled>ストップ</button>
                <button id="resetBtn" class="btn btn-reset">リセット</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
